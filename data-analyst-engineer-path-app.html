<title>Data analyst - Engineer path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : page de texte sobre, colonne d'étapes à gauche, contenu à droite. Filets fins, pas de cartes. */
:root{
  --bg:#FFFFFF; --ink:#1A1C1F; --muted:#666B73; --line:#E3E5E8; --soft:#F5F6F7; --link:#1F4FA8; --done:#2F6B45; --due:#9A5B12; --danger:#A33A2B;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161718;--ink:#E7E8EA;--muted:#9A9EA5;--line:#2C2E31;--soft:#1E2022;--link:#8EB0F0;--done:#7CC296;--due:#E0A35A;--danger:#E58A7C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161718;--ink:#E7E8EA;--muted:#9A9EA5;--line:#2C2E31;--soft:#1E2022;--link:#8EB0F0;--done:#7CC296;--due:#E0A35A;--danger:#E58A7C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f)}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
a{color:var(--link);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--link);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:18px;border-bottom:1px solid var(--line)}
header p{max-width:65ch}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.9rem;color:var(--muted);margin-top:6px}
.summary b{color:var(--ink);font-weight:600}
.summary .due b{color:var(--due)}
.progress{height:3px;background:var(--line);margin-top:10px;max-width:420px}
.progress span{display:block;height:100%;background:var(--ink)}
.next{margin-top:14px;font-size:.95rem}
.linkbtn{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkbtn.danger{color:var(--danger)}
.editbar{margin-top:12px;padding:10px 12px;background:var(--soft);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.9rem}
nav.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 0 10px;font:500 .92rem var(--f);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs .n{color:var(--due);margin-left:4px}
main{padding-top:24px}
/* parcours */
.cols{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;align-items:start}
.phases{list-style:none;margin:0;padding:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.phases button{appearance:none;background:none;border:0;width:100%;text-align:left;font:inherit;color:var(--muted);padding:6px 0;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.phases button:hover{color:var(--ink)}
.phases button[aria-current="true"]{color:var(--ink);font-weight:600}
.phases .pc{font-size:.82rem}
.phases .ok .pc{color:var(--done)}
.phases .foot{padding-top:10px}
@media (max-width:760px){
  .cols{grid-template-columns:minmax(0,1fr);gap:20px}
  .phases{position:static;display:flex;gap:16px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:6px}
  .phases button{width:auto;white-space:nowrap}
  .phases .foot{display:none}
}
section{min-width:0}
.ph-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.ph-head .meta{font-size:.85rem;color:var(--muted)}
.ph-head p{max-width:65ch}
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lesson{border-bottom:1px solid var(--line);padding:12px 0}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start}
.lrow label{font-weight:600;cursor:pointer}
.lrow .why{color:var(--muted);font-size:.92rem;margin-top:2px}
.lrow .rv{font-size:.8rem;color:var(--muted);margin-top:2px}
.lrow .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.875rem}
.lesson.done label{color:var(--muted);font-weight:500}
input[type=checkbox]{width:16px;height:16px;margin:4px 0 0;accent-color:var(--ink);cursor:pointer}
.detail{margin:10px 0 2px 32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;font-size:.92rem}
@media (max-width:640px){.detail{grid-template-columns:minmax(0,1fr);margin-left:0}}
.detail h4{margin:0 0 6px;font-size:.82rem;font-weight:600;color:var(--muted)}
.detail ul,.detail ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.detail .kind{color:var(--muted)}
.detail a{overflow-wrap:anywhere}
.detail .note{margin-top:10px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.project{margin-top:28px;padding-top:16px;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.project .meta{font-size:.85rem;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;cursor:pointer}
.checks .on{color:var(--muted);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:4px;max-width:480px;min-width:0}
.field label{font-size:.85rem;color:var(--muted)}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=url],input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%}
textarea{font:.88rem/1.5 var(--m);resize:vertical;min-height:90px}
.btn{appearance:none;font:500 .9rem var(--f);border:1px solid var(--ink);border-radius:3px;padding:6px 12px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.form{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .field{max-width:none}
.formtitle{font-size:.85rem;font-weight:600;color:var(--muted)}
/* listes génériques */
.intro{max-width:65ch;color:var(--muted);margin-bottom:18px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list > li{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:4px}
.list .meta{font-size:.85rem;color:var(--muted)}
.list ol{margin:4px 0 0;padding-left:18px}
.status{font-size:.85rem}
.status.ok{color:var(--done)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.tw{overflow-x:auto}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.85rem}
td.del{text-align:right;padding-right:0;white-space:nowrap}
.x{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit}
.logform{display:grid;grid-template-columns:150px 100px minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:22px}
@media (max-width:640px){.logform{grid-template-columns:1fr 1fr}.logform .wide{grid-column:1/-1}}
.weeks{display:flex;gap:3px;margin:6px 0 4px;flex-wrap:wrap}
.weeks span{width:12px;height:12px;background:var(--soft);border:1px solid var(--line)}
.weeks span.l1{background:color-mix(in srgb,var(--ink) 25%,var(--bg))}
.weeks span.l2{background:color-mix(in srgb,var(--ink) 55%,var(--bg))}
.weeks span.l3{background:var(--ink)}
.sync{font-size:.82rem;color:var(--muted)}
/* texte de référence */
.ref{display:flex;flex-direction:column;gap:28px;max-width:72ch}
.ref section{display:flex;flex-direction:column;gap:8px}
.ref h3{margin-top:4px}
.ref ul,.ref ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ref pre{background:var(--soft);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;font:.84rem/1.5 var(--m);margin:0}
.ref code{font:.86em var(--m);background:var(--soft);padding:1px 4px}
.ref pre code{background:none;padding:0}
.ref .rule{border-left:2px solid var(--ink);padding-left:12px}
.subnav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;margin-bottom:22px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap" id="app">
  <header>
    <div class="toprow">
      <h1>Data analyst - Engineer path</h1>
      <button class="linkbtn small" id="editToggle" data-act="editmode" type="button">Modifier le contenu</button>
    </div>
    <p class="muted">SQL Server, SSIS, entrepôt de données, Power BI et DAX, jusqu’à l’exploitation. Chaque étape : des leçons, puis un projet dans le même dépôt.</p>
    <div id="stats"></div>
    <div id="next"></div>
    <div id="editbar"></div>
    <div class="sync" id="sync" data-s="local"><span>Sauvegarde locale (ce navigateur)</span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<script>
/* ---------- CONTENU PAR DÉFAUT ---------- */
const R=(t,label,url)=>({t,label,url});
const L=(id,title,why,res,check,note)=>({id,title,why,res,check,note:note||""});
const MS="https://learn.microsoft.com/";

const DEFAULT_PHASES=[
{id:"s0",code:"S0",short:"Méthode et poste",title:"Méthode de travail et poste de travail",layer:"Infra",dur:"3 h + installation",
 goal:"Savoir lire une documentation, diagnostiquer seul, et disposer de la même stack qu’en entreprise, versionnée dès le premier jour.",
 lessons:[
  L("s0l1","Lire la documentation officielle","Sélecteur de version, navigation de gauche, section Examples lue en premier, lecture des signatures de fonction.",[
    R("doc","Documentation SQL Server",MS+"sql/sql-server/"),
    R("doc","Référence T-SQL",MS+"sql/t-sql/language-reference"),
    R("doc","Documentation Power BI",MS+"power-bi/"),
    R("doc","Documentation SSIS",MS+"sql/integration-services/sql-server-integration-services"),
    R("doc","dax.guide","https://dax.guide/"),
    R("doc","Référence du langage M",MS+"powerquery-m/")],
   ["Où vérifier qu’une page de documentation s’applique à la version de SQL Server utilisée ?","Dans CALCULATE ( <Expression> [, <Filter> [, …] ] ), quels arguments sont optionnels ?","Pourquoi lire la section Examples avant la syntaxe ?"]),
  L("s0l2","Diagnostiquer et chercher","Numéro d’erreur SQL Server, dernière erreur de la pile SSIS, requêtes de recherche ciblées, exemple minimal reproductible.",[
    R("forum","DBA Stack Exchange","https://dba.stackexchange.com/"),
    R("forum","Stack Overflow","https://stackoverflow.com/"),
    R("forum","Fabric / Power BI Community","https://community.fabric.microsoft.com/"),
    R("forum","SQLServerCentral forums","https://www.sqlservercentral.com/forums")],
   ["Quelle partie d’un message d’erreur SQL Server faut-il rechercher ?","Où se trouve l’erreur utile d’un package SSIS en échec ?","Quels sont les cinq éléments d’une question bien posée ?"],
   "Règle des 30 / 60 minutes : rédiger la question après 30 minutes de blocage, la publier après 60."),
  L("s0l3","Installer la stack","SQL Server Developer, SSMS, Visual Studio avec SSDT et l’extension SSIS, Power BI Desktop, DAX Studio, Tabular Editor 2, Bravo, ALM Toolkit, Git.",[
    R("outil","SQL Server (édition Developer)","https://www.microsoft.com/sql-server/sql-server-downloads"),
    R("outil","SSMS",MS+"ssms/download-sql-server-management-studio-ssms"),
    R("outil","Visual Studio Community","https://visualstudio.microsoft.com/vs/community/"),
    R("doc","SQL Server Data Tools",MS+"sql/ssdt/download-sql-server-data-tools-ssdt"),
    R("outil","Extension SSIS","https://marketplace.visualstudio.com/items?itemName=SSIS.MicrosoftDataToolsIntegrationServices"),
    R("outil","Power BI Desktop","https://www.microsoft.com/download/details.aspx?id=58494"),
    R("outil","DAX Studio","https://daxstudio.org/"),
    R("outil","Tabular Editor 2","https://github.com/TabularEditor/TabularEditor/releases"),
    R("outil","Bravo","https://bravo.bi/"),
    R("outil","ALM Toolkit","http://alm-toolkit.com/"),
    R("outil","BI Developer Extensions","https://bideveloperextensions.github.io/")],
   ["Pourquoi l’édition Express ne convient pas à ce parcours ?","Où s’installent les extensions SSIS, SSRS et SSAS ?","Pourquoi cette stack impose-t-elle Windows ?"],
   "Les extensions BI de Visual Studio ne sont pas installées avec SSDT : elles s’ajoutent depuis le Marketplace. Power BI Desktop, SSMS et SSIS n’existent pas sous Linux ni macOS."),
  L("s0l4","Bases d’entraînement et Git","Restaurer AdventureWorks, WideWorldImporters et leurs entrepôts, générer Contoso. Commit, branche, merge, .gitignore.",[
    R("base","Bases d’entraînement","#donnees"),
    R("livre","Pro Git (FR), chapitres 1 à 3","https://git-scm.com/book/fr/v2"),
    R("exo","Learn Git Branching","https://learngitbranching.js.org/?locale=fr_FR")],
   ["Comment restaurer un fichier .bak depuis SSMS ?","Que ne faut-il jamais committer (mots de passe, chaînes de connexion, fichiers .user, bin/obj) ?"])
 ],
 project:{id:"pj0",title:"Dépôt socle",brief:"Un dépôt Git unique pour tout le parcours, avec ses conventions posées dès le départ.",
  deliv:["README : objectif, stack, schéma d’architecture en Mermaid","Arborescence /sql /sql/mco /ssis /powerbi /docs /notes","Conventions écrites : schémas stg, ods, dwh ; préfixes fct_, dim_, v_, usp_","Fichier .gitignore adapté à Visual Studio, SSIS et Power BI","Fichiers troubleshooting.md et journal d’apprentissage créés","Login SQL dédié svc_etl avec des droits minimaux"],
  stretch:["Premier ADR : pourquoi un dépôt unique"]}},

{id:"s1",code:"S1",short:"T-SQL fondamentaux",title:"T-SQL fondamentaux",layer:"SSMS",dur:"22 h",
 goal:"Écrire sans hésiter des requêtes correctes et lisibles sur une base réelle.",
 lessons:[
  L("s1l1","Ordre logique d’exécution","FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. Logique à trois valeurs des NULL.",[
    R("cours","MS Learn : Get started querying with Transact-SQL",MS+"training/paths/get-started-querying-with-transact-sql/"),
    R("exo","SQLBolt","https://sqlbolt.com/"),
    R("cours","Mode SQL Tutorial","https://mode.com/sql-tutorial/")],
   ["Pourquoi un alias défini dans le SELECT n’est-il pas utilisable dans le WHERE ?","Pourquoi WHERE col = NULL ne renvoie aucune ligne ?","Dans quel ordre le moteur évalue-t-il les clauses d’une requête ?"]),
  L("s1l2","Jointures et filtrage","INNER, LEFT, RIGHT, FULL, CROSS. Anti-jointures. Opérateurs de filtrage.",[
    R("doc","Jointures",MS+"sql/relational-databases/performance/joins"),
    R("cours","Mode : SQL joins","https://mode.com/sql-tutorial/sql-joins/")],
   ["Pourquoi un LEFT JOIN suivi d’un filtre WHERE sur la table de droite se comporte comme un INNER JOIN ?","Pourquoi NOT IN sur une sous-requête contenant un NULL renvoie zéro ligne ? Que faire à la place ?","Écrire une anti-jointure de deux façons."]),
  L("s1l3","Agrégats, sous-requêtes et CTE","GROUP BY, HAVING, sous-requêtes corrélées, EXISTS, expressions de table communes.",[
    R("doc","WITH (CTE)",MS+"sql/t-sql/queries/with-common-table-expression-transact-sql"),
    R("doc","EXISTS",MS+"sql/t-sql/language-elements/exists-transact-sql")],
   ["Quelle différence entre WHERE et HAVING ?","Quand une CTE est-elle préférable à une sous-requête ?","Écrire une requête qui renvoie le dernier achat de chaque client."]),
  L("s1l4","Vues et procédures stockées","Vues pour centraliser la logique, procédures paramétrées pour les traitements.",[
    R("doc","CREATE VIEW",MS+"sql/t-sql/statements/create-view-transact-sql"),
    R("doc","CREATE PROCEDURE",MS+"sql/t-sql/statements/create-procedure-transact-sql")],
   ["À quoi sert une vue au-delà de raccourcir une requête ?","Pourquoi paramétrer une procédure plutôt que construire la requête en concaténant du texte ?"])
 ],
 project:{id:"pj1",title:"Requêtes analytiques WideWorldImporters",brief:"Une série de requêtes métier sur WideWorldImporters, versionnées dans /sql.",
  deliv:["25 requêtes : jointures, agrégats, sous-requêtes, CTE","Démonstration écrite du piège LEFT JOIN + WHERE","5 vues réutilisables","3 procédures stockées paramétrées","Chaque script commenté et commité"],
  stretch:["Mêmes questions résolues de deux façons différentes, avec comparaison"]}},

{id:"s2",code:"S2",short:"T-SQL avancé",title:"T-SQL avancé et performance",layer:"SSMS",dur:"22 h",
 goal:"Maîtriser les fonctions de fenêtrage et comprendre ce que fait le moteur.",
 lessons:[
  L("s2l1","Fonctions de fenêtrage","ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, SUM OVER, cadres ROWS et RANGE.",[
    R("doc","Clause OVER",MS+"sql/t-sql/queries/select-over-clause-transact-sql"),
    R("cours","MS Learn : Write advanced Transact-SQL queries",MS+"training/modules/write-advanced-transact-sql-queries/")],
   ["Écrire un dédoublonnage qui garde la ligne la plus récente par clé.","Donner un exemple où ROW_NUMBER, RANK et DENSE_RANK diffèrent.","Pourquoi un cumul en RANGE peut surprendre sur des dates en double ?"]),
  L("s2l2","Regroupements avancés","GROUPING SETS, ROLLUP, CUBE, PIVOT, APPLY.",[
    R("doc","GROUP BY",MS+"sql/t-sql/queries/select-group-by-transact-sql"),
    R("doc","FROM, APPLY",MS+"sql/t-sql/queries/from-transact-sql")],
   ["Quand CROSS APPLY remplace avantageusement une sous-requête ?","Comment distinguer une ligne de total produite par ROLLUP ?"]),
  L("s2l3","Index et statistiques","Index cluster et non cluster, colonnes INCLUDE, index couvrants, statistiques.",[
    R("livre","Use The Index, Luke (FR)","https://use-the-index-luke.com/fr"),
    R("cours","SQLServerCentral Stairways (index)","https://www.sqlservercentral.com/stairways")],
   ["Pourquoi WHERE YEAR(date) = 2025 empêche un seek ? Réécrire la condition.","Qu’apporte une colonne INCLUDE ?","Quand des statistiques obsolètes faussent-elles un plan ?"]),
  L("s2l4","Plans d’exécution","Scan et seek, key lookup, hash join et nested loop, mesure avec STATISTICS IO et TIME.",[
    R("cours","Brent Ozar : How to Think Like the SQL Server Engine","https://www.brentozar.com/training/think-like-sql-server-engine/"),
    R("doc","Plans d’exécution",MS+"sql/relational-databases/performance/execution-plans")],
   ["Seek ou scan : lequel est un problème, et quand ?","Que mesure SET STATISTICS IO ON ?","Que signale un key lookup répété des milliers de fois ?"])
 ],
 project:{id:"pj2",title:"Optimisation mesurée",brief:"Des requêtes analytiques et des optimisations documentées avec chiffres avant et après.",
  deliv:["15 requêtes en fonctions de fenêtrage : cumuls, cohortes, comparaison N-1, classements","3 requêtes lentes optimisées, mesures IO et TIME avant et après","Une requête non sargable écrite, observée en scan, corrigée en seek","Notes de performance dans /docs avec captures des plans"],
  stretch:["Série d’exercices DataLemur","Comparaison de deux stratégies d’index sur la même requête"]}},

{id:"s3",code:"S3",short:"Backup et DWH",title:"Sauvegarde, administration et architecture DWH",layer:"DWH",dur:"22 h",
 goal:"Savoir protéger une base et concevoir la chaîne complète entre la source et le rapport.",
 lessons:[
  L("s3l1","Sauvegarde et restauration","Modes SIMPLE et FULL, sauvegardes FULL, DIFF et LOG, chaîne de restauration, STOPAT, RPO et RTO.",[
    R("doc","Back up and restore",MS+"sql/relational-databases/backup-restore/back-up-and-restore-of-sql-server-databases"),
    R("doc","Modes de récupération",MS+"sql/relational-databases/backup-restore/recovery-models-sql-server")],
   ["Que permet le mode FULL que le mode SIMPLE ne permet pas ?","Dans quel ordre restaurer FULL, DIFF et LOG ?","Comment RPO et RTO déterminent-ils la fréquence des sauvegardes ?"]),
  L("s3l2","Maintenance automatisée","Ola Hallengren, dbatools, SQL Server Agent, Database Mail.",[
    R("outil","Ola Hallengren Maintenance Solution","https://ola.hallengren.com/"),
    R("outil","dbatools","https://dbatools.io/"),
    R("doc","SQL Server Agent",MS+"ssms/agent/sql-server-agent"),
    R("doc","Database Mail",MS+"sql/relational-databases/database-mail/database-mail")],
   ["Pourquoi une sauvegarde jamais restaurée n’est pas une sauvegarde ?","Que fait Test-DbaLastBackup ?"]),
  L("s3l3","Couches d’une architecture décisionnelle","Sources, STG (brut 1:1, colonnes d’audit), ODS (nettoyé, intégré), DWH (étoile, historisé), modèle sémantique, rapports.",[
    R("doc","Kimball Group : Dimensional Modeling Techniques","https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/"),
    R("doc","Schéma en étoile pour Power BI",MS+"power-bi/guidance/star-schema")],
   ["À quoi sert le staging si l’ODS existe ?","Pourquoi ne pas brancher Power BI directement sur la base de production ?","Quelles colonnes d’audit porte une table de staging ?"]),
  L("s3l4","Modélisation dimensionnelle","Grain, clés de substitution, dimensions conformes, junk, dégénérée, bridge, factless, membre Inconnu.",[

function prepPhases(list){return list.map(p=>Object.assign({},p,{project:Object.assign({},p.project,{deliv:p.project.deliv.map((t,i)=>typeof t==="string"?{id:p.project.id+"-"+i,t}:t)})}))}

const LS_KEY="da-engineer-path-v1", UI_KEY="da-engineer-path-ui";
const INTERVALS=[2,7,21,60];
function blank(){return {v:1,updatedAt:0,done:{},deliv:{},projDone:{},repos:{},log:[],content:null}}
function normalize(s){const b=blank();s=s&&typeof s==="object"?s:{};for(const k of Object.keys(b)){if(s[k]===undefined)s[k]=b[k]}if(!Array.isArray(s.log))s.log=[];return s}
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadLocal(){try{const s=localStorage.getItem(LS_KEY);if(s)return normalize(JSON.parse(s))}catch(e){}return blank()}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
let state=loadLocal();
let ui={tab:"parcours",phase:"s0",open:{},editMode:false,edit:null};
try{const u=JSON.parse(localStorage.getItem(UI_KEY)||"null");if(u){ui=Object.assign(ui,u);ui.edit=null}}catch(e){}
const TABS=[["parcours","Parcours"],["revisions","Révisions"],["jalons","Jalons"],["methode","Méthode"],["reference","Référence"],["donnees","Données"],["journal","Journal"]];
if(/^#[a-z]+$/.test(location.hash)&&TABS.some(t=>"#"+t[0]===location.hash))ui.tab=location.hash.slice(1);
function saveUi(){try{const u=Object.assign({},ui,{edit:null});localStorage.setItem(UI_KEY,JSON.stringify(u))}catch(e){}}

function C(){return state.content||DEFAULT}
function editContent(fn){if(!state.content)state.content=clone(DEFAULT);fn(state.content);persist()}
function lessons(){return C().phases.flatMap(p=>p.lessons.map(l=>Object.assign({phase:p},l)))}
function projects(){return C().phases.map(p=>Object.assign({phase:p},p.project))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* dates et texte */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(iso){if(!iso)return"";const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){u=String(u||"").trim();if(/^https?:\/\/\S+$/i.test(u))return u;if(/^#[A-Za-z0-9._~-]+$/.test(u))return u;return ""}
function lines(s){return String(s||"").split("\n").map(x=>x.trim()).filter(Boolean)}
function parseRes(line){const parts=line.split("|").map(x=>x.trim());if(parts.length>=3)return {t:parts[0]||"lien",label:parts[1]||parts[0],url:safeUrl(parts.slice(2).join("|"))};if(parts.length===2)return {t:"lien",label:parts[0],url:safeUrl(parts[1])};return {t:"note",label:parts[0],url:""}}
function resLine(r){return (r.t||"lien")+" | "+r.label+" | "+(r.url||"")}

/* ---------- SYNCHRO ---------- */
const remote={ref:null,writing:false,pending:false,timer:null};
function setSync(s){const el=document.getElementById("sync");el.dataset.s=s;el.lastElementChild.textContent=s==="cloud"?"Synchronisé sur le compte":s==="error"?"Synchronisation en échec, sauvegarde locale":"Sauvegarde locale (ce navigateur)"}
function persist(){state.updatedAt=Date.now();saveLocal();render();if(remote.ref){clearTimeout(remote.timer);remote.timer=setTimeout(flush,700)}}
async function flush(){if(!remote.ref)return;if(remote.writing){remote.pending=true;return}remote.writing=true;
 try{await remote.ref.set(clone(state));setSync("cloud")}
 catch(e){if(e&&(e.code==="invalid_argument"||e.code==="not_granted"||e.code==="revoked")){remote.ref=null;setSync("local")}else setSync("error")}
 remote.writing=false;if(remote.pending){remote.pending=false;flush()}}
async function initRemote(){
 if(!window.claude||typeof window.claude.use!=="function"){setSync("local");return}
 try{
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user){setSync("local");return}
  const id=await user.id(); if(!id){setSync("local");return}
  const ref=db.doc("data/users/"+id+"/progress");
  const snap=await ref.get();
  const remoteAt=snap.exists?(snap.data().updatedAt||0):0;
  if(snap.exists&&remoteAt>(state.updatedAt||0)){state=normalize(clone(snap.data()));saveLocal();if(!ui.edit)render()}
  remote.ref=ref;
  if(state.updatedAt>remoteAt)flush(); else setSync("cloud");
  ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const d=s.data();if((d.updatedAt||0)>(state.updatedAt||0)){state=normalize(clone(d));saveLocal();if(!ui.edit)render()}},()=>{});
 }catch(e){setSync("local")}
}

/* ---------- CALCULS ---------- */
function phaseStats(p){const n=p.lessons.length+1;let d=p.lessons.filter(l=>state.done[l.id]).length;if(state.projDone[p.project.id])d++;return {d,n,pct:Math.round(d/n*100)}}
function dueList(){const t=today();return lessons().filter(l=>{const x=state.done[l.id];return x&&x.next&&x.next<=t}).sort((a,b)=>state.done[a.id].next.localeCompare(state.done[b.id].next))}
function upcoming(){const t=today();return lessons().filter(l=>{const x=state.done[l.id];return x&&x.next&&x.next>t}).sort((a,b)=>state.done[a.id].next.localeCompare(state.done[b.id].next)).slice(0,6)}
function nextStep(){for(const p of C().phases){for(const l of p.lessons)if(!state.done[l.id])return {kind:"lesson",p,l};if(!state.projDone[p.project.id])return {kind:"project",p}}return null}
function totalMinutes(){return state.log.reduce((a,e)=>a+(+e.min||0),0)}
function curPhase(){const ps=C().phases;return ps.find(x=>x.id===ui.phase)||ps[0]}

/* ---------- ACTIONS ---------- */
function toggleLesson(id,on){if(on){const t=today();state.done[id]={at:t,stage:0,next:addDays(t,INTERVALS[0])}}else delete state.done[id];persist()}
function review(id,ok){const x=state.done[id];if(!x)return;const t=today();if(ok){const s=x.stage+1;x.stage=s;x.next=s<INTERVALS.length?addDays(t,INTERVALS[s]):null}else{x.stage=0;x.next=addDays(t,1)}x.last=t;persist()}

/* ---------- RENDU ---------- */
function render(){renderHeader();renderStats();renderNext();renderEditbar();renderTabs();renderView()}
function renderHeader(){document.getElementById("editToggle").textContent=ui.editMode?"Terminer les modifications":"Modifier le contenu"}
function renderStats(){
 const ls=lessons(),ps=projects();
 const ld=ls.filter(l=>state.done[l.id]).length, pd=ps.filter(p=>state.projDone[p.id]).length;
 const tot=ls.length+ps.length, pct=tot?Math.round((ld+pd)/tot*100):0, due=dueList().length, h=String(Math.round(totalMinutes()/6)/10).replace(".",",");
 document.getElementById("stats").innerHTML=
 `<div class="summary num"><span><b>${pct} %</b> du parcours</span><span><b>${ld}</b>/${ls.length} leçons</span><span><b>${pd}</b>/${ps.length} projets</span><span class="${due?"due":""}"><b>${due}</b> révision${due>1?"s":""} due${due>1?"s":""}</span><span><b>${h} h</b> au journal</span></div>
  <div class="progress"><span style="width:${pct}%"></span></div>`;
}
function renderNext(){
 const n=nextStep(), el=document.getElementById("next");
 if(!n){el.innerHTML=`<p class="next">Parcours terminé. Les révisions continuent dans l’onglet Révisions.</p>`;return}
 const label=n.kind==="lesson"?n.l.title:"projet : "+n.p.project.title;
 el.innerHTML=`<p class="next">Prochaine étape (${esc(n.p.code)}) : <button class="linkbtn" data-act="goto" data-phase="${n.p.id}" data-item="${n.kind==="lesson"?n.l.id:n.p.project.id}">${esc(label)}</button></p>`;
}
function renderEditbar(){
 const el=document.getElementById("editbar");
 if(!ui.editMode){el.innerHTML="";return}
 el.innerHTML=`<div class="editbar"><span>Mode édition. Les modifications sont enregistrées dès la validation d’un formulaire.</span>${state.content?`<button class="linkbtn danger" data-act="del" data-kind="reset">Rétablir le contenu d’origine</button>`:`<span class="muted">Contenu d’origine</span>`}</div>`;
}
function renderTabs(){const due=dueList().length;document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${ui.tab===k}" data-act="tab" data-tab="${k}">${l}${k==="revisions"&&due?`<span class="n">${due}</span>`:""}</button>`).join("")}
function renderView(){document.getElementById("view").innerHTML=({parcours:viewParcours,revisions:viewRevisions,jalons:viewJalons,methode:viewMethode,reference:viewReference,donnees:viewDonnees,journal:viewJournal})[ui.tab]()}

function isEditing(kind,id){return ui.edit&&ui.edit.kind===kind&&ui.edit.id===id}
function delBtn(kind,id,phase,label){return `<button class="linkbtn danger" data-act="del" data-kind="${kind}" data-id="${id}" data-phase="${phase||""}">${label||"Supprimer"}</button>`}
function editBtn(kind,id,phase,label){return `<button class="linkbtn" data-act="edit" data-kind="${kind}" data-id="${id}" data-phase="${phase||""}">${label||"Modifier"}</button>`}
function formActions(){return `<div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn alt" type="button" data-act="cancel">Annuler</button></div>`}
function fld(id,label,value,opts={}){
 const v=esc(value??"");
 if(opts.area)return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" rows="${opts.rows||5}">${v}</textarea>${opts.hint?`<span class="hint">${opts.hint}</span>`:""}</div>`;
 return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${opts.type||"text"}" value="${v}" ${opts.req?"required":""} maxlength="${opts.max||300}">${opts.hint?`<span class="hint">${opts.hint}</span>`:""}</div>`;
}

/* Parcours */
function viewParcours(){
 const ps=C().phases;
 if(!ps.length)return `<p class="muted">Aucune étape. ${ui.editMode?editBtn("phase","new","","Ajouter une étape"):"Activer « Modifier le contenu » pour en ajouter une."}</p>${isEditing("phase","new")?phaseForm(null):""}`;
 const p=curPhase();
 const nav=ps.map(x=>{const s=phaseStats(x);return `<li class="${s.d===s.n?"ok":""}"><button data-act="phase" data-phase="${x.id}" aria-current="${p.id===x.id}"><span>${esc(x.code)} ${esc(x.short)}</span><span class="pc num">${s.pct} %</span></button></li>`}).join("");
 const head=isEditing("phase",p.id)?phaseForm(p):`<div class="ph-head"><span class="meta">${esc(p.code)} · ${esc(p.layer)} · ${esc(p.dur)}</span><h2>${esc(p.title)}</h2><p class="muted">${esc(p.goal)}</p>${ui.editMode?`<div class="row small">${editBtn("phase",p.id,"","Modifier l’étape")}${delBtn("phase",p.id,"","Supprimer l’étape")}</div>`:""}</div>`;
 const addLesson=ui.editMode?(isEditing("lesson","new")&&ui.edit.phase===p.id?lessonForm(null,p):`<p class="small" style="margin-top:12px">${editBtn("lesson","new",p.id,"Ajouter une leçon")}</p>`):"";
 return `<div class="cols">
  <ul class="phases">${nav}<li class="muted small foot">8 semaines, environ 22 h par semaine</li>${ui.editMode?`<li class="small foot">${editBtn("phase","new","","Ajouter une étape")}</li>`:""}</ul>
  <section>
   ${isEditing("phase","new")?phaseForm(null):""}
   ${head}
   <ul class="lessons">${p.lessons.map((l,i)=>isEditing("lesson",l.id)?`<li>${lessonForm(l,p)}</li>`:lessonHtml(l,p,i)).join("")}</ul>
   ${addLesson}
   ${isEditing("project",p.project.id)?projectForm(p):projectHtml(p)}
  </section></div>`;
}
function resHtml(r){
 const u=safeUrl(r.url);
 let a;
 if(!u)a=esc(r.label);
 else if(u.startsWith("#")){const tab=u.slice(1);a=`<a href="${esc(u)}" data-act="tab" data-tab="${esc(tab)}">${esc(r.label)}</a>`}
 else a=`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r.label)}</a>`;
 return `<li>${a} <span class="kind">(${esc(r.t)})</span></li>`;
}
function lessonHtml(l,p,i){
 const d=state.done[l.id], open=!!ui.open[l.id];
 const rv=d?(d.next?`Fait le ${fmt(d.at)}, révision le ${fmt(d.next)}`:`Fait le ${fmt(d.at)}, acquis`):"";
 const code=String(p.code||"").replace(/^[A-Za-z]+/,"");
 return `<li class="lesson ${d?"done":""}" id="it-${l.id}">
  <div class="lrow"><input type="checkbox" id="cb-${l.id}" data-act="lesson" data-id="${l.id}" ${d?"checked":""}>
   <div><label for="cb-${l.id}">${esc(code)}.${i+1} ${esc(l.title)}</label><p class="why">${esc(l.why)}</p>${rv?`<p class="rv">${rv}</p>`:""}</div>
   <div class="acts"><button class="linkbtn" data-act="open" data-id="${l.id}" aria-expanded="${open}">${open?"Fermer":"Détails"}</button>${ui.editMode?editBtn("lesson",l.id,p.id)+delBtn("lesson",l.id,p.id):""}</div></div>
  ${open?`<div class="detail"><div><h4>Ressources</h4>${l.res.length?`<ul>${l.res.map(resHtml).join("")}</ul>`:`<p class="muted">Aucune ressource.</p>`}${l.note?`<p class="note">${esc(l.note)}</p>`:""}</div>
   <div><h4>Vérifier sans notes</h4>${l.check.length?`<ol>${l.check.map(q=>`<li>${esc(q)}</li>`).join("")}</ol>`:`<p class="muted">Aucune question.</p>`}</div></div>`:""}
 </li>`;
}
function projectHtml(p){
 const pr=p.project, done=!!state.projDone[pr.id];
 const nd=pr.deliv.filter(x=>state.deliv[x.id]).length;
 return `<section class="project" id="it-${pr.id}">
  <span class="meta">Projet ${esc(p.code)} · ${nd}/${pr.deliv.length} livrables${done?" · terminé":""}</span>
  <h3>${esc(pr.title)}</h3>${pr.brief?`<p>${esc(pr.brief)}</p>`:""}
  ${ui.editMode?`<div class="row small">${editBtn("project",pr.id,p.id,"Modifier le projet")}</div>`:""}
  <ul class="checks">${pr.deliv.map(x=>{const on=!!state.deliv[x.id];return `<li><label><input type="checkbox" data-act="deliv" data-id="${esc(x.id)}" ${on?"checked":""}><span class="${on?"on":""}">${esc(x.t)}</span></label></li>`}).join("")}</ul>
  ${pr.stretch.length?`<p class="muted small">Pour aller plus loin : ${pr.stretch.map(esc).join(" ; ")}.</p>`:""}
  <div class="field"><label for="repo-${pr.id}">Lien du dépôt</label><input id="repo-${pr.id}" type="url" placeholder="https://github.com/…" value="${esc(state.repos[pr.id]||"")}" data-act="repo" data-id="${pr.id}"></div>
  <div class="row"><button class="btn ${done?"alt":""}" data-act="projdone" data-id="${pr.id}">${done?"Rouvrir le projet":"Marquer le projet terminé"}</button>${state.repos[pr.id]?`<a href="${esc(safeUrl(state.repos[pr.id]))}" target="_blank" rel="noopener">Ouvrir le dépôt</a>`:""}</div>
 </section>`;
}
function phaseForm(p){
 const n=!p;p=p||{code:"S"+C().phases.length,short:"",title:"",layer:"",dur:"",goal:""};
 return `<form class="form" data-form="phase" data-id="${n?"new":p.id}"><span class="formtitle">${n?"Nouvelle étape":"Modifier l’étape"}</span>
  <div class="grid">${fld("f-code","Code",p.code,{req:true,max:10})}${fld("f-short","Nom court (colonne de gauche)",p.short,{req:true,max:40})}${fld("f-layer","Couche",p.layer,{max:40})}${fld("f-dur","Durée",p.dur,{max:40})}</div>
  ${fld("f-title","Titre",p.title,{req:true,max:120})}${fld("f-goal","Objectif",p.goal,{area:true,rows:3})}${formActions()}</form>`;
}
function lessonForm(l,p){
 const n=!l;l=l||{title:"",why:"",res:[],check:[],note:""};
 return `<form class="form" data-form="lesson" data-id="${n?"new":l.id}" data-phase="${p.id}"><span class="formtitle">${n?"Nouvelle leçon dans "+esc(p.code):"Modifier la leçon"}</span>
  ${fld("f-title","Titre",l.title,{req:true,max:120})}${fld("f-why","Description",l.why,{area:true,rows:2})}
  ${fld("f-res","Ressources",l.res.map(resLine).join("\n"),{area:true,rows:5,hint:"Une par ligne : type | libellé | lien. Exemple : doc | Référence T-SQL | https://learn.microsoft.com/… Un lien commençant par # ouvre un onglet (#donnees, #reference)."})}
  ${fld("f-check","Questions de vérification",l.check.join("\n"),{area:true,rows:4,hint:"Une question par ligne."})}
  ${fld("f-note","Note",l.note,{area:true,rows:2})}${formActions()}</form>`;
}
function projectForm(p){
 const pr=p.project;
 return `<form class="form" data-form="project" data-id="${pr.id}" data-phase="${p.id}"><span class="formtitle">Modifier le projet ${esc(p.code)}</span>
  ${fld("f-title","Titre",pr.title,{req:true,max:120})}${fld("f-brief","Présentation",pr.brief,{area:true,rows:2})}
  ${fld("f-deliv","Livrables",pr.deliv.map(x=>x.t).join("\n"),{area:true,rows:6,hint:"Un livrable par ligne. Une ligne inchangée garde son état coché."})}
  ${fld("f-stretch","Pour aller plus loin",pr.stretch.join("\n"),{area:true,rows:3,hint:"Une idée par ligne."})}${formActions()}</form>`;
}

/* Révisions */
function viewRevisions(){
 const due=dueList(), up=upcoming();
 const list=due.length?`<ul class="list">${due.map(l=>`<li><span class="meta">${esc(l.phase.code)} ${esc(l.phase.short)} · révision ${state.done[l.id].stage+1} sur ${INTERVALS.length}</span><strong>${esc(l.title)}</strong>${l.check.length?`<ol>${l.check.map(q=>`<li>${esc(q)}</li>`).join("")}</ol>`:""}
   <div class="row" style="margin-top:6px"><button class="btn" data-act="rev" data-id="${l.id}" data-ok="1">Acquis</button><button class="btn alt" data-act="rev" data-id="${l.id}" data-ok="0">À revoir demain</button></div></li>`).join("")}</ul>`
  :`<p class="muted">Aucune révision due aujourd’hui. Les leçons cochées reviennent ici à J+2, J+7, J+21 puis J+60.</p>`;
 return `<p class="intro">Répondre aux questions sans notes avant de valider. « Acquis » repousse la révision suivante (2, 7, 21 puis 60 jours). « À revoir demain » repart du début.</p>${list}
  ${up.length?`<h3 style="margin-top:28px">À venir</h3><ul class="list" style="margin-top:8px">${up.map(l=>`<li><span>${esc(l.title)} <span class="muted small">· ${fmt(state.done[l.id].next)}</span></span></li>`).join("")}</ul>`:""}`;
}

/* Jalons */

 const form=ui.edit&&ui.edit.kind==="milestone"?milestoneForm(ui.edit.id==="new"?null:ms.find(m=>m.id===ui.edit.id)):"";

  <ul class="list">${ms.map(m=>{const u=safeUrl(m.url);return `<li><span class="meta">${esc(m.k)}</span><strong>${esc(m.t)}</strong><p class="muted">${esc(m.d)}</p><span class="status ${reached(m)?"ok":""}">${reached(m)?"Atteint":"Pas encore"}${u?` · <a href="${esc(u)}" target="_blank" rel="noopener">page officielle</a>`:""}</span>${ui.editMode?`<div class="row small">${editBtn("milestone",m.id)}${delBtn("milestone",m.id)}</div>`:""}</li>`}).join("")}</ul>`;

/* Méthode */
function viewMethode(){
 return `<div class="ref">
 <p class="intro" style="margin:0">Des ressources choisies plutôt qu’un cours unique, des questions de vérification à chaque leçon, un projet par étape. Les leçons s’apprennent sans assistant IA ; l’IA n’entre dans le travail qu’une fois la compétence acquise.</p>
 <section><h2>Lire la documentation</h2><ul>
  <li><b>Sélecteur de version.</b> En haut des pages SQL Server, un menu indique la version (2022, 2019, Azure SQL). La plupart des réponses fausses viennent d’une page lue dans la mauvaise version. Le bandeau « Applies to » précise le périmètre.</li>
  <li><b>Navigation de gauche.</b> Elle donne le plan du chapitre. Une page isolée trouvée par un moteur de recherche manque souvent de contexte.</li>
  <li><b>Section Examples.</b> En bas de page ; à lire avant la syntaxe.</li>
  <li><b>Signatures.</b> <code>&lt; &gt;</code> obligatoire, <code>[ ]</code> optionnel, <code>…</code> répétable.</li></ul></section>
 <section><h2>Diagnostiquer</h2><ul>
  <li>Un message SQL Server porte un numéro (<code>Msg 8134</code>) : c’est lui qu’on recherche, pas la phrase entière.</li>
  <li>Dans SSIS, l’erreur utile est en fin de pile ou dans l’onglet Progress / Execution Results.</li>
  <li>Requêtes de recherche : produit et version (<code>SSIS 2022 lookup no match output</code>), <code>site:learn.microsoft.com</code>, numéro d’erreur entre guillemets, <code>sqlbi</code> ou <code>radacad</code> pour DAX. Écarter les articles Power BI antérieurs à 2022.</li></ul></section>
 <section><h2>Demander de l’aide</h2><p>Une question qui obtient une réponse contient un exemple minimal reproductible :</p><ol>
  <li>Le contexte en une phrase (outil, version)</li><li>Le DDL et une dizaine de lignes d’exemple anonymisées</li><li>Ce qui a été tenté</li><li>Le résultat obtenu et le résultat attendu</li><li>Le message d’erreur exact</li></ol>
  <p class="muted">Rédiger ces cinq points résout souvent le problème avant publication. Règle des 30 / 60 minutes : rédiger après 30 minutes de blocage, publier après 60.</p></section>
 <section><h2>Apprendre durablement</h2><ol>
  <li><b>Se tester plutôt que relire.</b> Répondre aux questions de vérification sans notes avant de cocher une leçon.</li>
  <li><b>Espacer les révisions.</b> Chaque leçon cochée revient dans l’onglet Révisions à J+2, J+7, J+21 puis J+60.</li>
  <li><b>Sessions courtes et régulières.</b> Cinq séances d’une heure valent mieux qu’une séance de cinq heures. Chaque séance se note au Journal.</li>
  <li><b>Construire avant de se sentir prêt.</b> Le projet est l’endroit où l’on apprend, pas un examen.</li>
  <li><b>Refaire sans le tutoriel.</b> Recréer le package ou la mesure à partir d’une page blanche. Ce qui ne revient pas est à revoir.</li>
  <li><b>Expliquer par écrit.</b> Une note courte par leçon dans /notes, écrite pour un collègue débutant.</li>
  <li><b>Tout versionner.</b> SQL, SSIS, PBIP, documentation. Un fichier troubleshooting.md recense chaque erreur et sa solution.</li>
  <li><b>Aucun code copié sans pouvoir l’expliquer ligne par ligne</b>, quelle que soit sa source.</li></ol></section>
 <section><h2>L’IA dans le workflow</h2>
  <p><b>Apprentissage : sans IA.</b> Un assistant qui fournit la réponse produit le résultat sans construire le modèle mental. La compétence visée est la capacité à valider, et elle ne se construit qu’en faisant soi-même.</p>
  <p><b>Production : avec IA, sous conditions.</b></p><ol>
   <li>Ne générer que ce qu’on sait écrire soi-même.</li>
   <li>Soumettre toute production IA aux contrôles habituels : plan d’exécution pour le SQL, DAX Studio pour le DAX, test d’idempotence pour l’ETL, rapprochement des chiffres pour tout.</li>
   <li>Aucune donnée de production ni donnée personnelle dans un outil public, sauf outil d’entreprise validé.</li></ol>
  <p>Copilot ne répond qu’à partir du modèle sémantique : schéma, descriptions (tronquées à 200 caractères), synonymes, expressions DAX. Un schéma en étoile propre et des définitions validées sont donc le prérequis de l’IA.</p>
  <div class="tw"><table><thead><tr><th>Gain réel</th><th>Risque</th></tr></thead><tbody>
   <tr><td>DDL, code répétitif, données de test</td><td>Définitions métier : elles ne se devinent pas</td></tr>
   <tr><td>Squelettes de fonctions M, expressions régulières</td><td>Chiffres : aucun nombre non rapproché ne doit être diffusé</td></tr>
   <tr><td>Première version de documentation</td><td>DAX complexe : erreurs fréquentes sur la context transition</td></tr>
   <tr><td>Traduction d’une règle de gestion en SQL</td><td>Optimisation : l’IA ne lit ni plan d’exécution ni Server Timings</td></tr>
   <tr><td>Relecture de code</td><td>Modélisation : le grain est une décision</td></tr>
   <tr><td>Descriptions et synonymes en masse, relus</td><td>SQL plausible mais faux, qui s’exécute sans erreur</td></tr></tbody></table></div>
  <p class="rule">Ne jamais déléguer à l’IA une compétence non acquise. Lui déléguer du temps sur des compétences maîtrisées.</p></section>
 </div>`;
}

/* Référence */
function viewReference(){
 return `<div class="ref">
 <nav class="subnav" aria-label="Sections"><a href="#r-archi">Architecture</a><a href="#r-mco">Exploitation</a><a href="#r-cdc">Cahier des charges</a><a href="#r-projet">Conduite de projet</a><a href="#r-diag">Diagnostic</a><a href="#r-veille">Veille</a></nav>
 <section id="r-archi"><h2>Chaîne de référence</h2>
  <pre><code>Sources -> STG (brut, 1:1) -> ODS (nettoyé, intégré, grain opérationnel)
        -> DWH (étoile, historisé) -> Modèle sémantique -> Rapports</code></pre>
  <ul><li><b>STG</b> : copie brute de la source avec colonnes d’audit (<code>source_system</code>, <code>extract_datetime</code>, <code>batch_id</code>).</li>
   <li><b>ODS</b> : données intégrées et nettoyées, état courant.</li>
   <li><b>DWH</b> : schéma en étoile, historisation SCD, clés de substitution, membre Inconnu.</li></ul>
  <h3>Nettoyage entre ODS et DWH</h3><ol><li>Déduplication selon une règle explicite</li><li>Standardisation (casse, espaces, formats, codes)</li><li>Résolution d’entités</li><li>Valeurs manquantes rattachées au membre Inconnu</li><li>Règles de gestion documentées</li><li>Contrôle des types et rejet motivé</li><li>Résolution des clés de substitution</li><li>Historisation SCD2</li></ol></section>

 <section id="r-mco"><h2>Maintien en condition opérationnelle</h2>
  <p>Le MCO consiste à prouver que la chaîne fonctionne, à tracer chaque vérification et à réagir vite. Objectif : automatiser la détection pour que le contrôle quotidien se limite à confirmer l’absence d’alerte.</p>
  <h3>Chaque jour (10 à 15 min, 5 min avec alertes)</h3><ul>
   <li>Flux SSIS exécutés et réussis, nombre de lignes et durée cohérents (zéro ligne chargée signale un problème)</li>
   <li>Rafraîchissements réussis, à l’heure, durée stable</li><li>Ordres de grandeur des indicateurs clés</li>
   <li>Nouvelles lignes en table de rejets : volume et motif</li><li>Valeurs sources non mappées</li><li>Inscription au journal MCO</li></ul>
  <h3>Chaque semaine (30 à 45 min)</h3><ul><li>Sauvegardes exécutées, restauration testée régulièrement</li><li>Espace disque, croissance de l’ODS et du DWH</li><li>Historique des jobs Agent</li><li>Tendance des durées d’ETL et de rafraîchissement</li></ul>
  <h3>Chaque mois</h3><ul><li>Statistiques d’utilisation : un rapport sans consultation depuis trois mois est candidat à l’archivage</li><li>Revue des tables de correspondance avec leurs responsables métier</li><li>Revue des accès aux workspaces et aux Apps</li><li>Maintenance des index et statistiques</li><li>Revue des contenus certifiés</li></ul>
  <h3>Runbooks</h3><ul>
   <li><b>Flux SSIS en échec</b> : SSISDB, All Executions, View Messages, dernière erreur. Cause transitoire : relance. Cause structurelle : correction d’abord. Vérifier l’idempotence, tracer.</li>
   <li><b>Rafraîchissement en échec</b> : historique, cause (passerelle, identifiants, source en retard), correction, relance, contrôle des ordres de grandeur.</li>
   <li><b>Chiffre incohérent</b> : remonter visuel, mesure, modèle, DWH, ODS, STG, source. La couche où l’écart apparaît est fautive. Vérifier rejets, valeurs non mappées, SCD2 mal clôturée, RLS.</li>
   <li><b>Rafraîchissement lent</b> : isoler ETL et Power BI ; côté Power BI, vérifier le folding et le rafraîchissement incrémental.</li></ul>
  <h3>Requêtes de surveillance (/sql/mco)</h3>
  <pre><code>-- Échecs SSIS des dernières 24 h
SELECT folder_name, project_name, package_name, start_time, end_time
FROM SSISDB.catalog.executions
WHERE status = 4
  AND start_time >= DATEADD(DAY, -1, SYSDATETIMEOFFSET())
ORDER BY start_time DESC;

-- Messages d'erreur d'une exécution
SELECT message_time, message
FROM SSISDB.catalog.operation_messages
WHERE operation_id = @exec_id AND message_type = 120
ORDER BY message_time;

-- Dernière sauvegarde par base
SELECT d.name,
  MAX(CASE WHEN b.type = 'D' THEN b.backup_finish_date END) AS last_full,
  MAX(CASE WHEN b.type = 'L' THEN b.backup_finish_date END) AS last_log
FROM sys.databases d
LEFT JOIN msdb.dbo.backupset b ON b.database_name = d.name
WHERE d.database_id > 4
GROUP BY d.name;</code></pre>
  <h3>Page de contrôle qualité</h3><p>Indicateurs critiques et valeur attendue (N-1, moyenne mobile, budget), écart en pourcentage signalé, date du dernier rafraîchissement par source, rejets et valeurs non mappées du dernier chargement.</p></section>

 <section id="r-cdc"><h2>Modèle de cahier des charges</h2><p>À rédiger avant toute ligne de code.</p>
  <pre><code># Projet : [Nom]
Sponsor · Key user · Réalisation · Date · Version

## 1. Contexte et objectif
Le besoin métier, en langage métier.

## 2. Périmètre
- Inclus / exclus
- Sources : systèmes, tables, fréquence, volumétrie
- Profondeur d'historique et justification

## 3. Définitions métier
| Indicateur | Définition | Règle de calcul | Exclusions | Validé par |

## 4. Modèle de données
Schéma en étoile, grain de chaque table de faits.

## 5. Fonctionnalités
Par page : contenu, filtres, granularité, public.

## 6. Droits d'accès
Groupes Entra ID, règles RLS et OLS.

## 7. Exploitation
Rafraîchissement, alertes, tables maintenues à la main, routine MCO.

## 8. Points de vigilance et dette technique

## 9. Recette
Critères d'acceptation, valideurs, chiffres de référence.</code></pre>
  <p>Les définitions métier sont le cœur du document ; elles alimentent aussi les AI instructions du modèle.</p>
  <h3>Livrables associés</h3><ul><li>Dictionnaire de données</li><li>Lineage de la source au visuel</li><li>ADR : une page par décision structurante</li><li>Runbooks</li><li>Journal MCO</li><li>Documentation de passation, tenue dès le début</li></ul>
  <h3>Tables de correspondance</h3><ol><li>Correction dans le système source</li><li>Dérivation par règle dans l’ETL</li><li>Table de référence en base avec responsable nommé et alerte sur les valeurs non mappées</li><li>Fichier Excel maintenu à la main, à éviter</li></ol>
  <p class="muted">Toute table maintenue s’accompagne d’une page listant les valeurs non mappées.</p></section>

 <section id="r-projet"><h2>Conduite d’un projet BI</h2><ol>
  <li><b>Cadrage</b> : entretiens métier, cahier des charges, validation des définitions</li>
  <li><b>Exploration</b> des sources dans SSMS : volumétrie, cardinalité, valeurs nulles, doublons</li>
  <li><b>Modélisation</b> : grain d’abord, étoile ensuite</li>
  <li><b>ETL</b> par couches, idempotence testée à chaque étape</li>
  <li><b>Modèle sémantique</b>, chiffres validés avec le métier sur un périmètre restreint</li>
  <li><b>Restitution, déploiement, documentation, formation</b></li>
  <li><b>Mise en exploitation</b> : alertes, contrôle qualité, journal, runbooks</li></ol>
  <h3>Erreurs fréquentes</h3><ol><li>Construire avant d’avoir validé les définitions métier.</li><li>Attendre de Power BI qu’il compense un mauvais modèle.</li><li>Ne pas documenter ni surveiller au fil de l’eau.</li></ol></section>

 <section id="r-diag"><h2>Réflexes de diagnostic</h2><div class="tw"><table><thead><tr><th>Symptôme</th><th>Outil ou démarche</th></tr></thead><tbody>
  <tr><td>Requête SQL lente</td><td>Plan d’exécution</td></tr><tr><td>Mesure DAX lente</td><td>DAX Studio, Server Timings</td></tr>

  <tr><td>Flux ou rafraîchissement en échec</td><td>Runbook, puis journal MCO</td></tr><tr><td>Décision structurante</td><td>ADR</td></tr></tbody></table></div></section>

/* Journal */
function viewJournal(){
 const t=today();
 const weeks=[];for(let i=19;i>=0;i--){const end=addDays(t,-7*i),start=addDays(end,-6);const m=state.log.filter(e=>e.d>=start&&e.d<=end).reduce((a,e)=>a+(+e.min||0),0);weeks.push({start,m})}
 const lvl=m=>m===0?"":m<600?"l1":m<1200?"l2":"l3";
 const rows=state.log.slice().sort((a,b)=>b.d.localeCompare(a.d));
 return `<form class="logform" id="logform">
   <div class="field"><label for="lg-d">Date</label><input id="lg-d" type="date" value="${t}" required></div>
   <div class="field"><label for="lg-m">Minutes</label><input id="lg-m" type="number" min="5" max="600" step="5" value="60" required></div>
   <div class="field wide" style="max-width:none"><label for="lg-t">Travail réalisé ou notion comprise</label><input id="lg-t" type="text" maxlength="200" placeholder="Ex. Lookup en cache complet sur dim_client" required></div>
   <div class="wide"><button class="btn" type="submit">Ajouter</button></div></form>
  <p class="muted small">20 dernières semaines (plus foncé : plus de 10 h, plus de 20 h)</p>
  <div class="weeks">${weeks.map(w=>`<span class="${lvl(w.m)}" title="Semaine du ${fmt(w.start)} : ${w.m} min"></span>`).join("")}</div>
  ${rows.length?`<div class="tw" style="margin-top:18px"><table><thead><tr><th>Date</th><th>Durée</th><th>Note</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td class="num">${fmt(e.d)}</td><td class="num">${e.min} min</td><td style="overflow-wrap:anywhere">${esc(e.txt)}</td><td class="del"><button class="x" data-act="dellog" data-id="${esc(e.id)}">Supprimer</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin-top:18px">Aucune séance notée. Chaque séance s’ajoute avec le formulaire ci-dessus.</p>`}`;
}

/* ---------- ÉDITION ---------- */
function removeLessonProgress(l){delete state.done[l.id]}
function doDelete(kind,id,phase){
 if(kind==="reset"){state.content=null;ui.edit=null;persist();return}
 if(kind==="phase"){editContent(c=>{const p=c.phases.find(x=>x.id===id);if(p){p.lessons.forEach(removeLessonProgress);delete state.projDone[p.project.id];p.project.deliv.forEach(x=>delete state.deliv[x.id])}c.phases=c.phases.filter(x=>x.id!==id);c.milestones.forEach(m=>{if(m.after===id)m.after=""});if(ui.phase===id)ui.phase=c.phases[0]?c.phases[0].id:""});saveUi();return}
 if(kind==="lesson"){editContent(c=>{const p=c.phases.find(x=>x.id===phase);if(p)p.lessons=p.lessons.filter(l=>l.id!==id)});delete state.done[id];persist();return}
 if(kind==="milestone"){editContent(c=>{c.milestones=c.milestones.filter(m=>m.id!==id)});return}
 if(kind==="bases"||kind==="sources"){editContent(c=>{c[kind]=c[kind].filter(r=>r.id!==id)});return}
}
function val(form,name){const el=form.elements[name];return el?String(el.value).trim():""}
function checkUrl(form,name){const el=form.elements[name];if(!el)return true;const v=el.value.trim();if(v&&!safeUrl(v)){el.setCustomValidity("Le lien doit commencer par https:// ou http://");el.reportValidity();return false}el.setCustomValidity("");return true}
function saveForm(form){
 const kind=form.dataset.form,id=form.dataset.id,phase=form.dataset.phase;
 if(kind==="phase"){
  const data={code:val(form,"f-code"),short:val(form,"f-short"),title:val(form,"f-title"),layer:val(form,"f-layer"),dur:val(form,"f-dur"),goal:val(form,"f-goal")};
  if(id==="new"){const nid=uid("p");editContent(c=>{c.phases.push(Object.assign({id:nid,lessons:[],project:{id:uid("pj"),title:"Projet "+data.code,brief:"",deliv:[],stretch:[]}},data))});ui.phase=nid}
  else editContent(c=>{const p=c.phases.find(x=>x.id===id);if(p)Object.assign(p,data)});
 }
 else if(kind==="lesson"){
  const data={title:val(form,"f-title"),why:val(form,"f-why"),res:lines(form.elements["f-res"].value).map(parseRes),check:lines(form.elements["f-check"].value),note:val(form,"f-note")};
  editContent(c=>{const p=c.phases.find(x=>x.id===phase);if(!p)return;if(id==="new"){const nid=uid("l");p.lessons.push(Object.assign({id:nid},data));ui.open[nid]=true}else{const l=p.lessons.find(x=>x.id===id);if(l)Object.assign(l,data)}});
 }
 else if(kind==="project"){
  editContent(c=>{const p=c.phases.find(x=>x.id===phase);if(!p)return;const pr=p.project;const old=pr.deliv.slice();
   const deliv=lines(form.elements["f-deliv"].value).map(t=>{const i=old.findIndex(x=>x.t===t);if(i>=0)return old.splice(i,1)[0];return {id:uid("d"),t}});
   old.forEach(x=>delete state.deliv[x.id]);
   pr.title=val(form,"f-title");pr.brief=val(form,"f-brief");pr.deliv=deliv;pr.stretch=lines(form.elements["f-stretch"].value)});
 }
 else if(kind==="milestone"){
  if(!checkUrl(form,"f-url"))return false;
  const data={k:val(form,"f-k"),t:val(form,"f-t"),d:val(form,"f-d"),url:safeUrl(val(form,"f-url")),after:val(form,"f-after")};
  editContent(c=>{if(id==="new")c.milestones.push(Object.assign({id:uid("m")},data));else{const m=c.milestones.find(x=>x.id===id);if(m)Object.assign(m,data)}});
 }
 else if(kind==="bases"||kind==="sources"){
  if(!checkUrl(form,"f-u"))return false;
  const data={n:val(form,"f-n"),u:safeUrl(val(form,"f-u")),w:val(form,"f-w"),f:val(form,"f-f"),p:val(form,"f-p")};
  editContent(c=>{if(!c[kind])c[kind]=[];if(id==="new")c[kind].push(Object.assign({id:uid(kind[0])},data));else{const r=c[kind].find(x=>x.id===id);if(r)Object.assign(r,data)}});
 }
 return true;
}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="tab"){e.preventDefault();if(TABS.some(t=>t[0]===b.dataset.tab)){ui.tab=b.dataset.tab;ui.edit=null;saveUi();render();window.scrollTo(0,0)}return}
 if(a==="phase"){ui.phase=b.dataset.phase;ui.edit=null;saveUi();render();return}
 if(a==="open"){ui.open[b.dataset.id]=!ui.open[b.dataset.id];saveUi();renderView();return}
 if(a==="goto"){ui.tab="parcours";ui.phase=b.dataset.phase;ui.open[b.dataset.item]=true;saveUi();render();const el=document.getElementById("it-"+b.dataset.item);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(a==="projdone"){const id=b.dataset.id;if(state.projDone[id])delete state.projDone[id];else state.projDone[id]=today();persist();return}
 if(a==="rev"){review(b.dataset.id,b.dataset.ok==="1");return}
 if(a==="dellog"){state.log=state.log.filter(x=>x.id!==b.dataset.id);persist();return}
 if(a==="editmode"){ui.editMode=!ui.editMode;ui.edit=null;saveUi();render();return}
 if(a==="edit"){ui.edit={kind:b.dataset.kind,id:b.dataset.id,phase:b.dataset.phase||""};if(b.dataset.kind!=="bases"&&b.dataset.kind!=="sources")ui.editMode=true;render();const f=document.querySelector("form[data-form]");if(f){const first=f.querySelector("input,textarea");if(first)first.focus()}return}
 if(a==="cancel"){ui.edit=null;render();return}
 if(a==="del"){
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="Confirmer la suppression";setTimeout(()=>{if(b.isConnected&&b.dataset.armed==="1"){b.dataset.armed="";b.textContent=b.dataset.label}},4000);return}
  doDelete(b.dataset.kind,b.dataset.id,b.dataset.phase);return}
});
document.addEventListener("change",e=>{
 const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
 if(a==="lesson")toggleLesson(t.dataset.id,t.checked);
 else if(a==="deliv"){if(t.checked)state.deliv[t.dataset.id]=true;else delete state.deliv[t.dataset.id];persist()}
 else if(a==="repo"){const v=t.value.trim();if(v&&!/^https?:\/\//i.test(v)){t.setCustomValidity("Le lien doit commencer par https://");t.reportValidity();return}t.setCustomValidity("");if(v)state.repos[t.dataset.id]=v;else delete state.repos[t.dataset.id];persist()}
});
document.addEventListener("input",e=>{const t=e.target;if(t&&t.setCustomValidity)t.setCustomValidity("")});
document.addEventListener("submit",e=>{
 const f=e.target;
 if(f.id==="logform"){e.preventDefault();
  const d=document.getElementById("lg-d").value,m=+document.getElementById("lg-m").value,txt=document.getElementById("lg-t").value.trim();
  if(!d||!m||!txt)return;
  state.log.push({id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d,min:m,txt});
  if(state.log.length>1500)state.log=state.log.slice(-1500);
  persist();return}
 if(f.dataset&&f.dataset.form){e.preventDefault();const ui0=ui.edit;ui.edit=null;if(saveForm(f)===false){ui.edit=ui0;return}render()}
});

render();
initRemote();
</script>
